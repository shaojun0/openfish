# The versioned check suite for this repository.
#
# NOTE ON PROVENANCE — please do not read this file as part of the application.
# The product code lives under `backend/` and carries no `check_*.py` of its own;
# this suite is *tooling*, and each check here is an agent-written artifact.
#
# `validated: false` is the honest marking: a check an agent wrote has not shown
# that it can fail, so it may **report but not gate** (see
# `services/check_suite.py`, `ManifestCheck`).  Flipping it to `true` is a human
# decision, made after watching it go red on the defect it is supposed to catch.
version: 1
checks:
  - id: mirror-catalog
    # Mirrors' overlay rows, the shipped first-run seed, the endpoint payloads
    # (byte-for-byte against the pre-seed tree) and the CLI import contract.
    # Needs a git checkout: it fetches its own baseline with `git archive`.
    # `python` is the interpreter the runner image provides (the same one its
    # other checks assume).  On a developer box that has no `python` on PATH, or
    # only a python3 too old for this backend, run the file directly:
    #   backend/.venv/bin/python .agent/checks/check_mirror_catalog.py
    command: python .agent/checks/check_mirror_catalog.py
    timeout: 120
    validated: false
