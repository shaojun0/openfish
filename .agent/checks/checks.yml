# The versioned check suite for this repository.
#
# NOTE ON PROVENANCE — please do not read this file as part of the application.
# The product code lives under `backend/` and carries no `check_*.py` of its own;
# this suite is *tooling*, and each check here is an agent-written artifact.
#
# `validated: false` is the honest marking: a check an agent wrote has not shown
# that it can fail, so it may **report but not gate** (see
# `services/check_suite.py`, `ManifestCheck`).  Flipping it to `true` is a human
# decision, made after watching it go red on the defect it is supposed to catch.
version: 1
checks:
  - id: mirror-catalog
    # Mirrors' overlay rows, the shipped first-run seed, the endpoint payloads
    # (byte-for-byte against the pre-seed tree) and the CLI import contract.
    # Needs a git checkout: it fetches its own baseline with `git archive`.
    # `python` is the interpreter the runner image provides (the same one its
    # other checks assume).  On a developer box that has no `python` on PATH, or
    # only a python3 too old for this backend, run the file directly:
    #   backend/.venv/bin/python .agent/checks/check_mirror_catalog.py
    command: python .agent/checks/check_mirror_catalog.py
    timeout: 120
    validated: false
  - id: blank-env-defaults
    # A blank forwarded knob (`VAR=` in `docker/.env`) must mean "unset" for
    # every field type, `list[str]` included: the two JSON-array variables the
    # container used to crash on were `ALLOW_EXTENSIONS=` and
    # `MODEL_PROBE_ALLOWED_HOSTS=`.  Walks the whole configuration tree, so a
    # future `:-}` line cannot smuggle the same boot failure back in.  Same
    # interpreter rule as above.
    command: python .agent/checks/check_blank_env_defaults.py
    timeout: 120
    validated: false
  - id: packages-dir-diagnostic
    # A broken symlink at `PACKAGES_DIR` (the `ln -s` mistake in docker/README
    # §4, where the host absolute path does not exist inside the container) must
    # be repaired when that is safe, and reported by name — variable, link and
    # target — when it is not, instead of the bare `FileExistsError: [Errno 17]
    # File exists` that stopped gunicorn's worker.  Runs `import app` in a
    # subprocess; the refused cases fail before the extensions load, and the
    # repaired one is pointed at a temp tree, so it touches no database.  Same
    # interpreter rule as above.
    command: python .agent/checks/check_packages_dir_diagnostic.py
    timeout: 120
    validated: false
  - id: catalog-store
    # The docs/tools catalogs are rows plus objects now, so this is where the
    # storage port, revisioning and the folder bridges are checked: a key maps
    # under its root and climbing out of it is refused, a save based on a stale
    # revision is a 409 rather than a win, import/export reproduce a hand-written
    # tree byte for byte, and every row's object exists with nothing unreferenced
    # left behind in either store.  The S3 mapping is driven through an in-memory
    # double, so it needs no bucket and no network; it turns the first-run seed
    # off itself (`SEED_CATALOGS=0` — a suite manifest can only name a command).
    # Same interpreter rule as above.
    command: python .agent/checks/check_catalog_store.py
    timeout: 120
    validated: false
  - id: discovery
    # Manifest auto-discovery, and the implicit gates hiding inside it.  A
    # conventional `test` / `check` / `lint` Makefile target silently acquires
    # veto power over a PR (`validated`), and the provider that lost the priority
    # order used to be dropped without a word.  Asserts this repository enrolls
    # no gate by accident, that the discovered set / order / argv / `validated`
    # marking follow the manifest, that a displaced or raising provider is named
    # in the suite reason, that `merge=True` runs every matched manifest, that a
    # `CheckCommand` which omits `validation` is report-only and a suite with no
    # gating check normalises to `unverified` rather than green, and that
    # `fix_guard_violations` refuses a `Makefile`.  Offline and hermetic: temp
    # trees and a recording executor.  Same interpreter rule as above.
    command: python .agent/checks/check_discovery.py
    timeout: 120
    validated: false
  - id: external-prefix
    # A deployment behind `location /pypi` keeps /pypi in every URL, in both
    # supported styles: the edge nginx strips the prefix and sends
    # `X-Forwarded-Prefix` (ProxyFix → SCRIPT_NAME), or `ROUTE_PREFIX` mounts
    # the Flask routes under it.  Exercises the `Link` header, the OpenAPI
    # `servers` entry and the catalog URL builders, and forbids a route module
    # re-deriving the prefix from `settings.server.route_prefix` (the defect
    # that made `/api/v1/*` documents emit links to a 404).  Runs `import app`
    # in two subprocesses with temp dirs, so it touches no database or catalog.
    # Same interpreter rule as above.
    command: python .agent/checks/check_external_prefix.py
    timeout: 120
    validated: false
  - id: startup-nonblocking
    # The first admin-stats computation must not run while `app` is imported.
    # It `stat`s every package file (the index scan stores size=0), and it used
    # to run inline during import — i.e. before gunicorn binds the port.  With a
    # large PACKAGES_DIR (or network/cold storage) that outlived the backend
    # healthcheck grace; the edge nginx depends on backend health, so
    # `docker compose up -d` failed with "dependency failed to start: container
    # openfish-backend is unhealthy" and nginx stayed in Created.  The check
    # imports `app` in a subprocess with `services.stats.compute` patched to
    # sleep: a synchronous first refresh makes the import slow and fails it.
    # Temp dirs only; same interpreter rule as above.
    command: python .agent/checks/check_startup_nonblocking.py
    timeout: 120
    validated: false
  - id: stats-request-path
    # The statistics endpoints must be cache-first.  `/api/v1/packages` used to
    # compute the whole aggregated dictionary per request (including a `stat`
    # of every package file, because the index stores size=0); on a 1.5 TB /
    # 160k-file catalog that outlived the 30 s reverse proxy, so the SPA got a
    # failure instead of a list and rendered it as "the registry has no
    # packages".  The overview page called the same endpoint for three
    # counters.  The check boots a real app in two subprocesses with temp dirs:
    # cold cache must answer from the index with `sizes_ready: false` and no
    # `Path.stat` at all, a warm cache must answer without calling
    # `services.stats.compute`, and a restart must serve the persisted
    # `stats_snapshot.json` without recomputing.  Same interpreter rule as
    # above.
    command: python .agent/checks/check_stats_request_path.py
    timeout: 120
    validated: false
  - id: session-identity-cache
    # A logged-in browser must not introspect its OAuth2 access token on every
    # request.  The login callback stores only the token, so `try_session` used
    # to resolve identity against the identity provider per request; on the
    # intranet that is ~16 s each, which presented as "every API is slow"
    # (suspected SQLite) while the handlers were fast.  The check runs a
    # counting fake introspection server: the first request may call it, the
    # second request and a permission-guarded API call must not, and the
    # session cookie must carry `uid`.  Temp dirs only; same interpreter rule
    # as above.
    command: python .agent/checks/check_session_identity_cache.py
    timeout: 120
    validated: false
  - id: pypi-skip-existing
    # twine 6.2.0 removed `--skip-existing` for every index that is not PyPI or
    # TestPyPI and rejects the flag in the client, so a self-hosted index cannot
    # intercept it; `STORAGE__ON_DUPLICATE=skip` is the server-side equivalent.
    # Drives the real upload endpoint with the multipart form twine 6.2.0 sends
    # (no `md5_digest`): a fresh upload stores the file; the default `conflict`
    # mode keeps `400` + "already exists" for twine (what twine <= 6.1 matched)
    # and `409` for other clients; `skip` makes the duplicate a `200` with the
    # stored file, its `.sha256` sidecar and its inode untouched and no temp file
    # left behind; `overwrite` replaces the bytes and refreshes the sidecar.
    # Also checks that the two deprecated booleans fold into the mode and that a
    # contradictory combination is refused.  Temp dirs and a throwaway SQLite
    # database only; same interpreter rule as above.
    command: python .agent/checks/check_pypi_skip_existing.py
    timeout: 120
    validated: false
