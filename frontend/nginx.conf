# ── frontend container ──────────────────────────────────────────────
# Serves the built SPA only.  It deliberately does not proxy the API: the edge
# nginx (docker/nginx/) routes /api, /simple, /npm, … straight to the backend
# container, so the browser's same-origin requests never land here.
#
# The bundle is referenced under the /static/dist/ prefix (vite `base`), which
# also lets Flask serve the very same build via FRONTEND_DIST_DIR when running
# without Docker.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container-level liveness probe for docker compose.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed bundles — safe to cache forever.  The rewrite strips the
    # public /static/dist prefix so `root` finds them at the filesystem root.
    location /static/dist/assets/ {
        rewrite ^/static/dist/assets/(.*)$ /assets/$1 break;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html and anything else the bundle references under the prefix.
    location /static/dist/ {
        rewrite ^/static/dist/(.*)$ /$1 break;
        access_log off;
    }

    # SPA history fallback: a deep link such as /admin or /documentation/npm
    # has no file on disk and must return the shell so vue-router can resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
