[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cpypiserver"
version = "0.1.0"
description = "A lightweight Python package server built with Flask."
requires-python = ">=3.12"
dependencies = [
    "clamd>=1.0.2",
    # Fernet (AES-128-CBC + HMAC) for the Forgejo git-identity tokens.
    # A runtime dependency, not a dev one: ``services/git_identity.py`` seals
    # every minted token with it, and a production image without it would 503
    # the git-credential endpoint.  Until now it only arrived transitively
    # through a dev extra, which is exactly what this list exists to prevent.
    "cryptography>=42",
    "flask-caching>=2.4",
    "flask>=3.1",
    "flask-pydantic>=0.14.0",
    "markdown-it-py>=3.0",
    # PostgreSQL driver (psycopg 3).  The ``binary`` extra bundles libpq, so the
    # image needs no libpq-dev / build toolchain.  Never imported while
    # DATABASE_URL is empty and SQLite is in use.
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.14.2",
    # Parses a repository's `.agent/review-policy.yml` — the file every rule's
    # level, due and autofix flag comes from.  A runtime dependency, not a dev
    # one: it must be present in the production image, not just in the venv that
    # happens to pull it in transitively through openapi-spec-validator.
    "pyyaml>=6.0",
    "python-magic>=0.4.27",
    "requests>=2.34.2",
    "sqlalchemy>=2.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
prod = ["gunicorn>=22"]
# Verification gates — see scripts/check_openapi.py, check_contract.py and
# check_lint.py (pyflakes: undefined names / dead imports).
dev = ["openapi-spec-validator>=0.7", "pyflakes>=3.2"]

[project.scripts]
cpypiserver = "app:main"
# Administrative CLI — roles, grants, and the superuser bootstrap.
cpypiserver-admin = "cli:main"
# Debian offline relay client — the four air-gap steps against a running server.
cpypiserver-debian-offline = "debian_offline_cli:main"

# Top-level single-file modules.  `packages.find` only discovers *packages*
# (directories), so without this a non-editable `pip install .` would place the
# packages but not these modules — and the `[project.scripts]` entries above
# would then point at importable-nothing.
[tool.setuptools]
py-modules = ["app", "cli", "debian_offline_cli", "errors", "schemas"]

[tool.setuptools.packages.find]
include = [
    "models*", "config*", "auth*", "index*", "services*",
    "extensions*", "routes*", "openapi*",
]
