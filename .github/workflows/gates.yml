# CI: the frontend smoke test a human runs locally too, so "green locally" and
# "green in CI" cannot diverge (DEVELOPMENT.md §9.4 / §10).
#
# The backend job used to live here: it installed `backend` with its dev extras
# and ran `make gates-backend`, which discovered and ran every
# `backend/scripts/check_*.py`.  That directory no longer exists, so the job is
# gone rather than left as a green no-op — the backend is simply **not** verified
# by this workflow.
#
# The remaining job calls into the root Makefile rather than repeating the
# command list.

name: gates

on:
  push:
    branches: ["**"]
  pull_request:

# A superseded run tells nobody anything; cancel it instead of paying for it.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must satisfy the engines the lockfile installs: `jsdom@30` declares
          # `^22.22.2 || ^24.15.0 || >=26.0.0` and its `undici@8` needs
          # `>=22.19.0`.  On node 20 the install still succeeds (npm only warns)
          # and then `require('jsdom')` dies with
          # `TypeError: webidl.util.markAsUncloneable is not a function`,
          # because undici reads that helper from `node:worker_threads`, which
          # only grew it in node 22.13.  Pinning 24 keeps CI on the same major
          # the frontend is developed against.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: make gates-frontend
        run: make gates-frontend
