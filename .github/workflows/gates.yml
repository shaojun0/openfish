# CI: the same gates a human runs, so "green locally" and "green in CI" cannot
# diverge (DEVELOPMENT.md §9.4 / §10).
#
# The repository had no CI at all before this workflow; it exists to make the
# Agent Hub's self-verification story real — an agent's PR must be checkable by
# the same `make gates` the agent itself ran.
#
# Two jobs, one per half of the repository, because they have different
# toolchains and neither should wait on the other:
#
#   backend   python 3.12 + `pip install -e '.[dev]'` (pyflakes, openapi
#             validator) + `make gates-backend`
#   frontend  node 20 + `npm ci` + `make gates-frontend`
#
# Both call into the root Makefile rather than repeating the command list, so
# adding a gate is a one-line change in `Makefile` and it is enforced here too.

name: gates

on:
  push:
    branches: ["**"]
  pull_request:

# A superseded run tells nobody anything; cancel it instead of paying for it.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install the backend and its dev extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # `make` is preinstalled on the GitHub runner image.  PYTHON=python is the
      # interpreter `setup-python` put on PATH — there is no `.venv` in CI, which
      # is exactly why the Makefile takes PYTHON as a variable.
      - name: make gates-backend
        run: make gates-backend PYTHON=python

  frontend:
    name: frontend gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: make gates-frontend
        run: make gates-frontend
