# CI: the frontend smoke test a human runs locally too, so "green locally" and
# "green in CI" cannot diverge (DEVELOPMENT.md §9.4 / §10).
#
# The backend job used to live here: it installed `backend` with its dev extras
# and ran `make gates-backend`, which discovered and ran every
# `backend/scripts/check_*.py`.  That directory no longer exists, so the job is
# gone rather than left as a green no-op — the backend is simply **not** verified
# by this workflow.
#
# The remaining job calls into the root Makefile rather than repeating the
# command list.

name: gates

on:
  push:
    branches: ["**"]
  pull_request:

# A superseded run tells nobody anything; cancel it instead of paying for it.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: make gates-frontend
        run: make gates-frontend
