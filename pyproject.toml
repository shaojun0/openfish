[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cpypiserver"
version = "0.1.0"
description = "A lightweight Python package server built with Flask."
requires-python = ">=3.12"
dependencies = [
    "clamd>=1.0.2",
    "cryptography>=49.0.0",
    "flask-caching>=2.4",
    "flask>=3.1",
    "flask-pydantic>=0.14.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-magic>=0.4.27",
    "requests>=2.34.2",
    "sqlalchemy>=2.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
prod = ["gunicorn>=22"]

[project.scripts]
cpypiserver = "app:main"

[tool.setuptools.packages.find]
include = ["models*", "config*", "auth*", "index*", "services*", "extensions*", "routes*"]
