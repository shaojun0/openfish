# ── openfish docker-compose ─────────────────────────────────────────
#   准备配置:  cp .env.example .env   然后编辑 .env 填入真实值
#   构建+启动: docker compose up -d --build
#   仅重建某个: docker compose build backend   /   docker compose build frontend
#   调试容器:  docker compose --profile debug up -d
#              docker exec -it openfish-backend-debug bash
#   可选数据库: docker compose --profile db up -d
#              （要让应用真正切到 PostgreSQL，见 docker/README.md 的
#                "PostgreSQL" 一节；仅起容器不会改变后端行为）
#
#   四个服务，各自独立构建：
#     frontend  Vue 3 SPA（node 构建 → nginx 静态托管）   ← frontend/Dockerfile
#     backend   Flask + gunicorn（API 与各生态协议）      ← backend/Dockerfile
#     nginx     边缘网关：唯一对外入口，按路径分流          ← docker/nginx/nginx.conf
#     db        PostgreSQL（profile: db，可选后端）
#
#   所有密钥/口令都通过同目录下的 .env 注入（见 .env.example），
#   不要把真实凭据写进本文件或提交到仓库。

name: openfish

# ── 后端共享配置（两个后端服务复用，避免逐项复制）──────────────────
x-backend-env: &backend-env
  # ── 服务器 ──────────────────────────────────────────────
  SERVER_NAME: cpypiserver
  HOST: 0.0.0.0
  PORT: "8080"
  PACKAGES_DIR: ${PACKAGES_DIR:-/app/share/cpypiserver_public/packages}
  PYTHON_BUILDS_DIR: ${PYTHON_BUILDS_DIR:-/app/share/cpypiserver_public/cpython}
  # 数据库：留空 = 使用 API_KEYS_FILE 指向的 SQLite 文件（默认，见下）。
  # 设为 PostgreSQL URL（postgresql+psycopg://user:pass@db:5432/openfish）
  # 即把 API key / 用户 / 角色 / 统计整体切到 db 服务。改这里的同时请用
  # --profile db 启动数据库，参考 docker/README.md。
  DATABASE_URL: ${DATABASE_URL:-}
  API_KEYS_FILE: /app/data/cpypiserver.db
  # 对本机可达的绝对基址；设备授权流程用它拼 verification_uri。
  # 走本 compose 的 nginx 时留空即可（从 X-Forwarded-* 推导）。
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  # ── 内网制品中心 ────────────────────────────────────────
  TOOLS_DIR: /app/tools
  NPM_DIR: /app/npm
  NODE_BUILDS_DIR: /app/node-builds
  DOCKER_DIR: /app/docker-images
  DEBIAN_DIR: /app/debian
  DOCS_DIR: /app/docs
  MODELS_FILE: /app/config/model_routes.json
  NPM_UPSTREAM: ${NPM_UPSTREAM:-https://registry.npmmirror.com}
  DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
  DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
  # ── 只读穿透代理（回源地址留空则仅服务本地制品）──────────
  NPM_PROXY_ENABLED: ${NPM_PROXY_ENABLED:-true}
  NPM_UPSTREAM_TOKEN: ${NPM_UPSTREAM_TOKEN:-}
  NPM_TIMEOUT: ${NPM_TIMEOUT:-30}
  NPM_CACHE_DIR: /app/data/cache/npm
  NPM_CACHE_MAX_MB: ${NPM_CACHE_MAX_MB:-512}
  DOCKER_UPSTREAM: ${DOCKER_UPSTREAM:-}
  DOCKER_UPSTREAM_USERNAME: ${DOCKER_UPSTREAM_USERNAME:-}
  DOCKER_UPSTREAM_PASSWORD: ${DOCKER_UPSTREAM_PASSWORD:-}
  DOCKER_DEFAULT_NAMESPACE: ${DOCKER_DEFAULT_NAMESPACE:-library}
  DOCKER_TIMEOUT: ${DOCKER_TIMEOUT:-60}
  DOCKER_CACHE_DIR: /app/data/cache/docker
  DOCKER_CACHE_MAX_MB: ${DOCKER_CACHE_MAX_MB:-1024}
  DEBIAN_UPSTREAM: ${DEBIAN_UPSTREAM:-}
  DEBIAN_TIMEOUT: ${DEBIAN_TIMEOUT:-60}
  DEBIAN_CACHE_DIR: /app/data/cache/debian
  DEBIAN_CACHE_MAX_MB: ${DEBIAN_CACHE_MAX_MB:-256}
  DEBIAN_METADATA_TTL: ${DEBIAN_METADATA_TTL:-300}
  # ── 离线更新中继（互联网 ↔ 内网）────────────────────────
  DEBIAN_SUITES: ${DEBIAN_SUITES:-bookworm bookworm-updates bookworm-security}
  DEBIAN_COMPONENTS: ${DEBIAN_COMPONENTS:-main}
  DEBIAN_ARCHES: ${DEBIAN_ARCHES:-amd64}
  DEBIAN_OFFLINE_DIR: /app/data/offline/debian
  DEBIAN_OFFLINE_MAX_MB: ${DEBIAN_OFFLINE_MAX_MB:-4096}
  DEBIAN_OFFLINE_RECOMMENDS: ${DEBIAN_OFFLINE_RECOMMENDS:-false}
  DEBUG: "false"
  # ── 安全（值来自 docker/.env，未设置则启动报错）─────────
  SECRET_KEY: ${SECRET_KEY:?请在 docker/.env 中设置 SECRET_KEY}
  # ── 认证 ────────────────────────────────────────────────
  AUTH_USERNAME: ${AUTH_USERNAME:-admin}
  AUTH_ASSERT: ${AUTH_ASSERT:-}
  OAUTH2_PRODUCT_ID: ${OAUTH2_PRODUCT_ID:-0}
  OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID:-}
  OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:-}
  OAUTH2_TOKEN_URL: ${OAUTH2_TOKEN_URL:-}
  OAUTH2_AUTHORIZE_URL: ${OAUTH2_AUTHORIZE_URL:-}
  OAUTH2_INTROSPECT_URL: ${OAUTH2_INTROSPECT_URL:-}
  OAUTH2_CA_BUNDLE: ${OAUTH2_CA_BUNDLE:-}
  IS_4A: ${IS_4A:-false}
  # ── 上传限制（需与 nginx client_max_body_size 保持一致）──
  MAX_CONTENT_LENGTH: "104857600"
  # ── Agent Hub：仓库面（decision D1 — Forgejo owns the git wire protocol）
  #    后端走 compose 内网 http://forgejo:3000，不经边缘 nginx。
  FORGEJO_BASE_URL: ${FORGEJO_BASE_URL:-http://forgejo:3000}
  # git 回退路径的容器内地址；留空 = 与 FORGEJO_BASE_URL 相同。
  FORGEJO_GIT_BASE_URL: ${FORGEJO_GIT_BASE_URL:-}
  # Forgejo 侧承载镜像的组织名（repos.forgejo_repo = "<owner>/<owner>__<name>"）。
  FORGEJO_OWNER: ${FORGEJO_OWNER:-openfish}
  # 给客户端展示的公开 git 前缀（只用于生成 URL，不参与认证）。
  FORGEJO_PUBLIC_BASE_URL: ${FORGEJO_PUBLIC_BASE_URL:-/git}
  # 平台专用 Forgejo admin token 与 webhook 共享密钥。
  # **密钥只走环境变量，永不进仓库、不进日志**（与 model_routes.json 的不落密原则一致）。
  # admin token 至少需要 `write:admin`（建用户 / 替用户铸票 / 删用户都在 /admin/*）。
  FORGEJO_ADMIN_TOKEN: ${FORGEJO_ADMIN_TOKEN:-}
  FORGEJO_WEBHOOK_SECRET: ${FORGEJO_WEBHOOK_SECRET:-}
  # Fernet 主密钥：加密落库 git_identities 表里的 Forgejo token（§5.2 身份兑换）。
  # 缺失时 /git-credential 返回 503，**不回退明文**。
  GIT_IDENTITY_KEY: ${GIT_IDENTITY_KEY:-}
  # 大仓保护（§8.2）：到上限标 partial=true 并由 API 显式暴露，绝不静默截断。
  IMPORT_MAX_ISSUES: ${IMPORT_MAX_ISSUES:-20000}
  IMPORT_MAX_COMMITS: ${IMPORT_MAX_COMMITS:-5000}
  IMPORT_MAX_RATE: ${IMPORT_MAX_RATE:-2}
  IMPORT_PAGE_SIZE: ${IMPORT_PAGE_SIZE:-50}
  IMPORT_POLL_INTERVAL: ${IMPORT_POLL_INTERVAL:-2}
  IMPORT_POLL_ATTEMPTS: ${IMPORT_POLL_ATTEMPTS:-150}
  IMPORT_HTTP_TIMEOUT: ${IMPORT_HTTP_TIMEOUT:-30}
  GIT_MIRROR_DIR: ${GIT_MIRROR_DIR:-/app/data/forgejo-mirror}
  # 智能体运行时（§9.2）；worker 跑在 profile `runner` 的容器里，后端只登记状态。
  AGENT_WORK_ROOT: ${AGENT_WORK_ROOT:-/work}
  AGENT_WORK_RETENTION_SECONDS: ${AGENT_WORK_RETENTION_SECONDS:-86400}
  AGENT_GATE_TIMEOUT: ${AGENT_GATE_TIMEOUT:-120}
  AGENT_MAX_FINDINGS: ${AGENT_MAX_FINDINGS:-50}
  # 生产侧准入控制：同一仓库的在途（queued/leased/running）任务上限。0 = 不限。
  # webhook 风暴或误配策略不会再把单一仓库灌满全局队列。
  AGENT_MAX_IN_FLIGHT_PER_REPO: ${AGENT_MAX_IN_FLIGHT_PER_REPO:-2}

# ── 智能体运行时沙箱的**全部**环境（§9.2）────────────────────────────
# 刻意**不**继承 x-backend-env：runner 会执行仓库自带的 check_*.py 与 headless
# review 命令（services/sandbox_env.py 又把这层再收窄一次），而 backend 的环境里
# 有 SECRET_KEY / FORGEJO_ADMIN_TOKEN / GIT_IDENTITY_KEY。沙箱只拿到三样东西：
#   1. 队列数据库（worker 必须领任务）；
#   2. 模型路由表（只读挂载 + MODELS_FILE）；
#   3. 一枚可单独吊销、**非 admin** 的 FORGEJO_RUNNER_TOKEN，同时用于 git
#      credential helper 与开 PR；未设置时 fix/PR 明确失败，不会静默借用 admin。
# 完整隔离（`network: internal` + 出口白名单）仍需部署侧网络分段，见
# docs/agent-hub/DESIGN-git-thin-layer.md。
x-runner-env: &runner-env
  # 队列数据库：默认 SQLite 文件；PostgreSQL 部署用 DATABASE_URL。
  API_KEYS_FILE: /app/data/cpypiserver.db
  DATABASE_URL: ${DATABASE_URL:-}
  # 模型路由：只读挂载。
  MODELS_FILE: /app/config/model_routes.json
  # Forgejo：只有内网基址与组织名，都不含密钥。
  FORGEJO_BASE_URL: ${FORGEJO_BASE_URL:-http://forgejo:3000}
  FORGEJO_OWNER: ${FORGEJO_OWNER:-openfish}
  # runner 专用凭据（**不是** FORGEJO_ADMIN_TOKEN）。
  FORGEJO_RUNNER_TOKEN: ${FORGEJO_RUNNER_TOKEN:-}
  # 运行时旋钮。
  AGENT_WORK_ROOT: /work
  AGENT_WORK_RETENTION_SECONDS: "${AGENT_WORK_RETENTION_SECONDS:-86400}"
  AGENT_GATE_TIMEOUT: "${AGENT_GATE_TIMEOUT:-120}"
  AGENT_MAX_FINDINGS: "${AGENT_MAX_FINDINGS:-50}"
  # headless review 命令：留空时 review 任务**明确失败**，不会被静默当 done。
  AGENT_REVIEW_COMMAND: "${AGENT_REVIEW_COMMAND:-}"
  AGENT_REVIEW_TIMEOUT: "${AGENT_REVIEW_TIMEOUT:-900}"
  # 仓库级策略优先：这里给空值，让 .agent/review-policy.yml 决定 pr_policy /
  # auto_fix；只有运维显式设置非空值才覆盖仓库策略。
  AGENT_PR_POLICY: "${AGENT_PR_POLICY:-}"
  AGENT_AUTO_FIX: "${AGENT_AUTO_FIX:-}"
  # 沙箱固定值。
  GIT_TERMINAL_PROMPT: "0"
  PYTHONDONTWRITEBYTECODE: "1"

# 制品库与运行态：**所有** bind-mount 源都在本文件所在的 docker/ 目录下
# （一律写成 ./xxx），挂载拓扑里不含任何宿主机绝对路径，也就没有 ../backend/…。
# 大件数据放在数据盘上时，把 docker/ 下的同名目录换成指向数据盘的符号链接即可，
# 换存储 = 重指一个符号链接，compose 文件一个字都不用改（见 docker/README.md）：
#   docker/share                   -> /media/.../openfish-mirror
#   docker/npm                     -> /media/.../openfish-mirror/npm
#   docker/node-builds             -> /media/.../openfish-mirror/node-builds
#   docker/docker-images           -> /media/.../openfish-mirror/docker-images
#   docker/debian                  -> /media/.../openfish-mirror/debian
#   docker/data                    -> ../backend/data
#   docker/config/model_routes.json -> ../backend/config/model_routes.json
x-backend-volumes: &backend-volumes
  # /app/share：python 包与 python-build-standalone；容器内两个子路径分别由
  # PACKAGES_DIR / PYTHON_BUILDS_DIR 指向。
  - ./share:/app/share
  # ── 内网制品中心：丢文件即生效，无需重建镜像 ──────────────
  - ./tools:/app/tools
  - ./npm:/app/npm
  - ./node-builds:/app/node-builds
  - ./docker-images:/app/docker-images
  - ./debian:/app/debian
  - ./docs:/app/docs
  # 模型路由表：改完刷新页面即可；管理员在 /models 页可在线编辑，故需可写
  - ./config/model_routes.json:/app/config/model_routes.json
  # SQLite 库与回源缓存，容器重建后不丢；backend/data 仍是本地开发的同一份
  - ./data:/app/data
  # 自备 TLS 证书（可选）：把 CA 链放到 docker/certs/ca_chain.pem 后取消注释。
  # 挂载点是 /app/certs（**不在** web 根目录）：服务端只匿名供应
  # GET /certs/ca_chain.pem 这一个文件，同目录下的私钥不会被暴露。
  # - ./certs/ca_chain.pem:/app/certs/ca_chain.pem:ro

services:
  # ── 后端：Flask + gunicorn，只在内网暴露 8080 ───────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: openfish-backend:latest
    container_name: openfish-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      <<: *backend-env
    volumes: *backend-volumes
    networks:
      - openfish
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── 前端：Vue SPA 构建产物，由自己的 nginx 静态托管 ──────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # 内网可换成镜像源，例如 https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: openfish-frontend:latest
    container_name: openfish-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - openfish
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  # ── Forgejo：git 协议面（decision D1）────────────────────────────
  # 只做两件事：承载 bare 仓库、实现 smart HTTP clone/push；**不发布宿主端口**，
  # 由边缘 nginx 暴露 /git/。原生 GitHub/Gitee migration 会连 issue / PR /
  # label / milestone 一起拉进来——这正是 §8「导入历史 issue」的实现方式。
  # 数据落在 ./forgejo（由 prepare-mounts.sh 创建），与现有 6 个挂载点同风格。
  forgejo:
    image: ${FORGEJO_IMAGE:-codeberg.org/forgejo/forgejo:15}
    container_name: openfish-forgejo
    restart: unless-stopped
    env_file:
      # The instance's identity and secrets live here, not in this file: the
      # template is tracked, the filled copy is 600 and gitignored.  Nothing
      # below overrides it, so `FORGEJO__server__ROOT_URL` in that file wins.
      - ./forgejo/forgejo.env
    expose:
      - "3000"
    volumes:
      - ./forgejo:/data
    networks:
      - openfish
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ── 智能体运行时（profile: runner，§9.2）─────────────────────────
  # 沙箱边界 = 容器边界：每任务在本容器内的 /work/<task_id> 以子进程执行，
  # 不挂宿主 docker socket、不按任务起容器。必须与 backend 共用同一数据库，
  # 否则 worker 领不到 backend 入队的任务。
  runner:
    build:
      context: ../backend
      dockerfile: ../docker/runner/Dockerfile
    image: openfish-runner:latest
    # **No `container_name` on purpose.**  A fixed name makes
    # `docker compose --profile runner up --scale runner=N` fail with
    # "container name is already in use", which is exactly the horizontal
    # scaling the queue's `FOR UPDATE SKIP LOCKED` claim path exists to support.
    # Compose derives a stable per-replica name (`<project>-runner-<n>`) without
    # it.  Single-replica usage is unchanged.
    profiles:
      - runner
    restart: unless-stopped
    command: ["python", "-m", "services.agent_queue", "worker", "--loop"]
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 512
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=512m
    environment:
      <<: *runner-env
    volumes:
      - ./agent-work:/work
      - ./data:/app/data
      - ./config/model_routes.json:/app/config/model_routes.json:ro
    networks:
      - openfish
    depends_on:
      backend:
        condition: service_healthy

  # ── 边缘网关：唯一对外入口，按路径分流到 frontend / backend ──────
  nginx:
    image: nginx:1.27-alpine
    container_name: openfish-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      forgejo:
        condition: service_started
    ports:
      - "${PYPISERVER_PORT:-20416}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 可选 TLS：把证书放进 docker/certs/ 后取消注释，并在 nginx.conf 中
      # 打开 443 监听块。
      # - ./certs:/etc/nginx/certs:ro
    networks:
      - openfish
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── 可选数据库（profile: db）────────────────────────────────────
  # 应用**默认不连它**：授权/API key/统计仍存在 backend/data 下的 SQLite。
  # 要让后端真正切到 PostgreSQL，除了启动本服务，还必须把 DATABASE_URL 指过来
  # （在 docker/.env 里设置，compose 会注入 backend 容器）：
  #   DATABASE_URL=postgresql+psycopg://openfish:<口令>@db:5432/openfish
  #   docker compose --profile db up -d
  # 迁移现有 SQLite 数据用 backend 的 cli.py，见 docker/README.md。
  # 也可以加 -f docker-compose.postgres.yml 让 backend 等 db 健康后再启动。
  db:
    image: postgres:16-alpine
    container_name: openfish-db
    profiles:
      - db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openfish}
      POSTGRES_USER: ${POSTGRES_USER:-openfish}
      # 默认值仅用于本地试用；对外或有真实数据时必须覆盖。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openfish-dev-only}
    volumes:
      - openfish_db_data:/var/lib/postgresql/data
    networks:
      - openfish
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openfish} -d ${POSTGRES_DB:-openfish}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 调试容器：只起 bash，方便改代码排查（profile: debug）─────────
  backend-debug:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: openfish-backend:latest
    container_name: openfish-backend-debug
    profiles:
      - debug
    ports:
      - "${PYPISERVER_DEBUG_PORT:-20417}:8080"
    environment:
      <<: *backend-env
      DEBUG: "true"
    volumes: *backend-volumes
    networks:
      - openfish
    command: >
      bash -c "echo '🔧 调试容器已启动';
               echo '   进入: docker exec -it openfish-backend-debug bash';
               echo '   手动启服务: cd /app && python app.py';
               sleep infinity"
    stdin_open: true
    tty: true

networks:
  openfish:
    driver: bridge

volumes:
  openfish_db_data:
