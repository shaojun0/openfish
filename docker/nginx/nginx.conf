# ── openfish edge nginx ─────────────────────────────────────────────
# The single public entry point.  It terminates the client connection and
# routes each request to exactly one upstream:
#
#   frontend  — the built SPA (static files) and every browser deep link
#   backend   — the JSON API, the package/registry/mirror wire protocols and
#               everything a package manager or script talks to
#
# Mounted at /etc/nginx/conf.d/default.conf by docker/docker-compose.yml.
#
# Path ownership mirrors Flask's own routing (backend/routes/__init__.py).
# The trailing slash is load-bearing: `/tools` is an SPA page, `/tools/` is the
# machine-facing catalog; the same holds for npm, docker, debian and packages.

upstream openfish_backend {
    server backend:8080;
}

upstream openfish_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # The backend accepts uploads up to MAX_CONTENT_LENGTH (100 MiB).  nginx
    # defaults to 1m and would reject them before Flask ever sees the request.
    client_max_body_size 100m;

    # ── Forwarded headers (the backend runs ProxyFix x_for/x_proto/x_host) ──
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ── Root ────────────────────────────────────────────────────────────
    # GET  /  → the SPA shell (frontend container)
    # POST /  → twine/pip upload (backend, package:write)
    location = / {
        limit_except POST { proxy_pass http://openfish_frontend; }
        proxy_pass http://openfish_backend;
    }

    # ── The built SPA bundle ────────────────────────────────────────────
    location /static/dist/ {
        proxy_pass http://openfish_frontend;
    }

    # ── Exact URLs with a machine-facing twin ───────────────────────────
    # Because `location /tools/` exists below, nginx answers `/tools` with a
    # 301 to `/tools/` — which would hand the SPA's Tools page to the backend
    # and get a 401.  The same collision exists for packages, npm, docker and
    # debian.  Pin the exact page URLs to the frontend: only the *slashed*
    # forms are catalogs.
    location = /packages { proxy_pass http://openfish_frontend; }
    location = /tools    { proxy_pass http://openfish_frontend; }
    location = /npm      { proxy_pass http://openfish_frontend; }
    location = /docker   { proxy_pass http://openfish_frontend; }
    location = /debian   { proxy_pass http://openfish_frontend; }

    # `location /auth/` below would 301 `/auth` to `/auth/`, but `/auth` is the
    # OAuth2 callback (routes/auth_routes.py) — an exact backend route.
    location = /auth { proxy_pass http://openfish_backend; }

    # ── Optional: gate the shell itself (the pre-split behaviour) ───────
    # By default the shell and its bundle are static and therefore anonymous:
    # the SPA loads, its first /api/v1/session call answers 401 and the client
    # redirects to /auth/login.  To have Flask refuse an anonymous browser
    # *before* any JavaScript runs, send these two locations to the backend
    # instead and give the backend the build:
    #
    #   1. mount the bundle into the backend container, e.g. add to the
    #      backend service in docker-compose.yml:
    #          - ../frontend/dist:/app/static/dist:ro
    #      and set FRONTEND_DIST_DIR=/app/static/dist on that service;
    #   2. replace the two proxy_pass lines above and the `location = /`
    #      frontend branch below with `proxy_pass http://openfish_backend;`.
    #
    # `app:read` then answers with 401, which the error handler turns into the
    # OAuth redirect (or a Basic challenge).

    # ── JSON API consumed by the SPA and by API-key clients ─────────────
    location /api/ {
        proxy_pass http://openfish_backend;
    }

    # ── Python (pip / uv / twine) ───────────────────────────────────────
    location /simple/ {
        proxy_pass http://openfish_backend;
    }
    location /packages/ {
        proxy_pass http://openfish_backend;
    }
    location /legacy/ {
        proxy_pass http://openfish_backend;
    }

    # ── Interpreter mirrors (python-build-standalone, nodejs.org/dist) ──
    location /python-builds/ {
        proxy_pass http://openfish_backend;
    }
    location /node-builds/ {
        proxy_pass http://openfish_backend;
    }

    # ── Artifact hub protocols ──────────────────────────────────────────
    location /tools/  { proxy_pass http://openfish_backend; }
    location /npm/    { proxy_pass http://openfish_backend; }
    location /docker/ { proxy_pass http://openfish_backend; }
    location /debian/ { proxy_pass http://openfish_backend; }

    # ── Documentation: /docs is the API description (anonymous), /docs/<eco>
    #    is the per-ecosystem Markdown docs (doc:read).  The SPA page that
    #    browses them lives at /documentation/<eco> and falls through to the
    #    frontend.
    location = /docs {
        proxy_pass http://openfish_backend;
    }
    location /docs/ {
        proxy_pass http://openfish_backend;
    }

    # ── Private CA chain: a client must fetch it before it can trust us ──
    location /certs/ {
        proxy_pass http://openfish_backend;
    }

    # ── Authentication and the device-authorization hand-off ─────────────
    location /auth/ {
        proxy_pass http://openfish_backend;
    }
    location = /device {
        proxy_pass http://openfish_backend;
    }
    location = /device/approve {
        proxy_pass http://openfish_backend;
    }

    # ── Health and API discovery ────────────────────────────────────────
    location = /health {
        proxy_pass http://openfish_backend;
    }
    location = /openapi.json {
        proxy_pass http://openfish_backend;
    }
    location = /llms.txt {
        proxy_pass http://openfish_backend;
    }
    location /.well-known/ {
        proxy_pass http://openfish_backend;
    }

    # ── Everything else is a browser deep link: the SPA resolves it ─────
    location / {
        proxy_pass http://openfish_frontend;
    }

    # ── Optional TLS ────────────────────────────────────────────────────
    # Terminate HTTPS here instead of at an upstream load balancer: drop the
    # certificate and key into docker/certs/, uncomment the 443 listener, the
    # 80→443 redirect and the mount in docker-compose.yml, then set
    # PUBLIC_BASE_URL=https://<host>:<port> in docker/.env so the
    # device-authorization flow hands back absolute URLs.
    #
    # listen 443 ssl;
    # http2 on;
    # ssl_certificate     /etc/nginx/certs/server.crt;
    # ssl_certificate_key /etc/nginx/certs/server.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
}
